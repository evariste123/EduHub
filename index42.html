<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤝Join-Team</title>
    <link rel="stylesheet" href="./index42.css">
</head>
<body>

<section id="join-team" class="item">
    
    <h2 class="h1">🚀 Join Our Team</h2>
    <p class="p">Fill out the form below and we will get back to you soon.</p>

    <form action="#" method="POST" enctype="" id="formData">
        
        <div class="item1">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required >
        </div>

        <div class="item2">
            <label for="email">Email Add:</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required >
        </div>

        <div class="item3">
            <label for="position" >Desired Position:</label>
            <select id="position" name="position" required >
                <option value="" disabled selected>Select a role...</option>
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="uiux">UI/UX Designer</option>
                <option value="data">Data Scientist</option>
                <option value="logistics">Logistics Coordinator</option>
            </select>
        </div>

        <div class="item4">
            <label for="resume">Upload Resume (PDF):</label>
            <input type="file" id="resume" name="resume" accept=".pdf" required >
        </div>

        <div class="item5">
            <label for="message" >Why do you want to join us?</label> <br>
            <textarea id="message" name="message" rows="4" placeholder="Tell us a bit about your motivation..." ></textarea>
        </div>

        <div class="item6">
        <button type="submit">
            Submit Application 📩
        </button>
        </div>
    </form>
    <div class="item7"><a href="./index37.html"><button type="button">Skip form⏭️</button></a></div>
</section>
<script src="./index42.js"></script>
</body>
</html>
